model:
  default: qwen3.8-max
  provider: alibaba-token-plan
  base_url: ''
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: xhigh
  personalities: {}
terminal:
  backend: local
  cwd: .
  font_family: FiraCode Nerd Font
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  allow_private_urls: true
  use_real_profile: true
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: auto
    model: anthropic/claude-opus-4.6
  review:
    provider: alibaba-token-plan
    model: qwen3.8-max
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: omarchy
  interim_assistant_messages: true
  pet:
    enabled: true
    slug: noir-webling
    scale: 0.5
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  edge:
    voice: en-US-BrianNeural
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: hindsight
delegation:
  max_iterations: 250
  max_concurrent_children: 1
  max_spawn_depth: 1
  oneshot_max_children: 1
moa:
  presets:
    default:
      reference_models:
        - provider: alibaba-token-plan
          model: qwen3.8-max
          enabled: true
        - provider: alibaba-token-plan
          model: deepseek-v4.1-flash
          enabled: true
      aggregator:
        provider: alibaba-token-plan
        model: deepseek-v4.1-flash
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: alibaba-token-plan
      model: qwen3.8-max
      enabled: true
    - provider: alibaba-token-plan
      model: deepseek-v4.1-flash
      enabled: true
  aggregator:
    provider: alibaba-token-plan
    model: deepseek-v4.1-flash
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
skills:
  creation_nudge_interval: 15
timezone: Mexico/General
kanban:
  review_dispatch: true
  max_in_progress: 3
  max_in_progress_per_profile: 1
code_execution:
  timeout: 300
  max_tool_calls: 50
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30
  loop_watchdog_probe_timeout_s: 10
  loop_watchdog_max_strikes: 3
  write_sessions_json: true
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 3
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 46
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
platforms:
  ntfy:
    enabled: true
    home_channel:
      platform: ntfy
      chat_id: ${HERMES_NTFY_TOPIC}
      name: Hermes Project
    extra:
      topic: ${HERMES_NTFY_TOPIC}
      unauthorized_dm_behavior: ignore
      server: https://ntfy.sh
max_concurrent_sessions: 3
onboarding:
  seen:
    tool_progress_prompt: true
